<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<!-- 不要写死 http://127.0.0.1:8765：页面被内网穿透/反代到别的域名时，写死的 base
     会让所有相对请求跑回本机，外网打开就是一片空白 -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231c1917'/%3E%3Ccircle cx='8' cy='8' r='3.2' fill='%2322c55e'/%3E%3C/svg%3E" />
<title>Capture 预览</title>
<style>
  :root {
    --bg: #f7f7f6;
    --surface: #ffffff;
    --border: #e7e5e4;
    --text: #1c1917;
    --muted: #78716c;
    --hint: #a8a29e;
    --ok: #16a34a;
    --bad: #dc2626;
    /* 预览最大 1366（= 游戏客户区宽度）；外面留出卡片的 padding/border */
    --page-max: 1400px;
    --card-pad: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 20px;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;      /* 画面宽度是算出来的，绝不出现横向滚动条 */
    font: 14px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { width: 100%; max-width: var(--page-max); margin: 0 auto; }
  .card {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
    padding: var(--card-pad);
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .tile {
    width: 100%;
    aspect-ratio: 16 / 9;      /* 首帧到达后由 JS 改成真实画面比例 */
    border-radius: 8px;
    overflow: hidden;
    background: #0c0a09;
    position: relative;
  }
  .tile img { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* H.264 视频模式：<video> 顶替 <img>，两者尺寸行为一致，遮罩层坐标不用改 */
  .tile video {
    width: 100%; height: 100%; object-fit: contain; display: none;
    background: #0c0a09;
  }
  .tile.video img { display: none; }
  .tile.video video { display: block; }
  .masklay {
    position: absolute; left: 0; top: 0;
    cursor: crosshair;
    touch-action: none;
  }
  /* 四周留出 PAD 的余量给遮罩层（贴边选区的把手在画面边界上，需要多一圈命中区）。
     负 margin 把这圈余量抵掉，画面宽度仍然等于卡片内容宽度。 */
  .tileWrap {
    position: relative;
    align-self: stretch;
    margin: 0 -10px;
    padding: 10px;
  }
  .tileWrap.editing .tile { outline: 1px solid #2563eb; outline-offset: 2px; }
  .tileWrap.editing .tile::after {
    content: "编辑模式 · 双击空白或 Esc 退出";
    position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
    padding: 2px 9px; border-radius: 999px;
    font-size: 11px; color: #fff; white-space: nowrap;
    background: rgba(37,99,235,.92);
  }
  .badge {
    position: absolute; left: 8px; top: 8px;
    display: flex; align-items: center; gap: 5px;
    padding: 3px 7px; border-radius: 999px;
    background: rgba(12,10,9,.62);
    font-size: 11px; color: #f5f5f4;
    backdrop-filter: blur(2px);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--hint); }
  .dot.on { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.22); }
  .dot.off { background: #ef4444; }
  .panel { display: flex; flex-direction: column; gap: 12px; }
  /* ---- 状态条读数（HP / MP / EXP）---- */
  .bars { display: flex; flex-direction: column; gap: 6px; }
  .bar { display: flex; align-items: center; gap: 9px; }
  .bk {
    width: 30px; flex: 0 0 auto;
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
    color: var(--muted);
  }
  .btrack {
    flex: 1 1 auto; height: 8px; border-radius: 999px;
    background: #e7e5e4; overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.07);
  }
  .btrack i {
    display: block; height: 100%; width: 0;
    border-radius: 999px;
    transition: width .22s ease-out, background .2s;
  }
  .bar[data-k="hp"] .btrack i { background: linear-gradient(90deg, #fb7185, #dc2626); }
  .bar[data-k="mp"] .btrack i { background: linear-gradient(90deg, #60c5f0, #2563eb); }
  .bar[data-k="exp"] .btrack i { background: linear-gradient(90deg, #d9f99d, #65a30d); }
  .bv {
    width: 46px; flex: 0 0 auto; text-align: right;
    font-size: 12px; color: var(--text);
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .bar.low .btrack i { background: linear-gradient(90deg, #fca5a5, #dc2626); }
  .bar.low .bv { color: var(--bad); font-weight: 600; }
  .bar.off .bv { color: var(--hint); }
  .rows {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 4px 22px;
  }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .k { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .v {
    font-size: 13px; font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .v.warn { color: var(--bad); }
  .v.small { font-size: 11px; }
  button:disabled { opacity: .55; cursor: default; }
  button.on { background: #eaf3de; border-color: #b5cf8f; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    flex: 1;
    padding: 7px 10px;
    font: inherit; font-size: 12.5px;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  button:hover { background: #f5f5f4; border-color: #d6d3d1; }
  button:active { background: #ececea; }
  .note { margin: 12px 2px 0; font-size: 11.5px; color: var(--hint); }
  /* ---- 遮罩编辑：右键菜单 / 删除确认 / toast ---- */
  .ctx {
    position: fixed; z-index: 60; min-width: 158px;
    padding: 5px; display: none; flex-direction: column; gap: 1px;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,.14);
  }
  .ctx.open { display: flex; }
  .ctx button {
    flex: none; text-align: left; padding: 7px 10px;
    border: 0; border-radius: 6px; background: transparent;
    font: inherit; font-size: 12.5px; color: var(--text);
  }
  .ctx button:hover { background: #f5f5f4; }
  .ctx button.danger { color: var(--bad); }
  .ctx button.danger:hover { background: #fef2f2; }
  .ctx hr { border: 0; border-top: 1px solid var(--border); margin: 4px 2px; }
  .cbox {
    position: fixed; inset: 0; z-index: 70;
    display: none; align-items: center; justify-content: center;
    background: rgba(28,25,23,.35);
  }
  .cbox.open { display: flex; }
  .cbox-card {
    width: 300px; padding: 18px; border-radius: 12px;
    background: #fff; box-shadow: 0 18px 44px rgba(0,0,0,.2);
  }
  .cbox-t { font-size: 14px; font-weight: 600; }
  .cbox-d { margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.55; }
  .cbox-btns { margin-top: 15px; display: flex; gap: 8px; justify-content: flex-end; }
  .cbox-btns button { flex: none; padding: 7px 15px; }
  .cbox-btns .danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  .cbox-btns .danger:hover { background: #b91c1c; border-color: #b91c1c; }
  .toast {
    position: fixed; left: 50%; bottom: 36px; z-index: 80;
    transform: translateX(-50%) translateY(10px);
    padding: 8px 15px; border-radius: 999px;
    background: rgba(28,25,23,.9); color: #fafaf9;
    font-size: 12.5px; opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .filterrow { margin-top: 10px; }
  .filterrow input {
    width: 100%;
    padding: 6px 9px;
    font: inherit; font-size: 12px;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 7px;
    outline: none;
  }
  .filterrow input:focus { border-color: #a8a29e; }
  /* 宽屏时按钮/输入框别拉成一整条，贴着左边排成一行更清爽 */
  @media (min-width: 720px) {
    .actions button { flex: 0 0 auto; min-width: 104px; padding: 7px 16px; }
    .filterrow { max-width: 420px; }
  }
  @media (max-width: 560px) {
    body { padding: 16px 10px; }
    .wrap { --card-pad: 12px; }
    .rows { grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 2px 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="tileWrap" id="tileWrap">
      <div class="tile" id="tile">
        <img id="view" alt="游戏画面预览" />
        <video id="video" muted playsinline autoplay></video>
        <div class="badge"><span class="dot" id="dot"></span><span id="badge">等待画面</span></div>
      </div>
      <!-- 遮罩层放在 tile 外面：tile 有 overflow:hidden 会把贴边的把手裁掉 -->
      <canvas id="maskLayer" class="masklay"></canvas>
    </div>

    <div class="panel">
      <div class="bars" id="bars">
        <div class="bar" data-k="hp"><span class="bk">HP</span><span class="btrack"><i></i></span><span class="bv">—</span></div>
        <div class="bar" data-k="mp"><span class="bk">MP</span><span class="btrack"><i></i></span><span class="bv">—</span></div>
        <div class="bar" data-k="exp"><span class="bk">EXP</span><span class="btrack"><i></i></span><span class="bv">—</span></div>
      </div>
      <div class="rows">
        <div class="row"><span class="k">条位置</span><span class="v small" id="barsrc">—</span></div>
        <div class="row"><span class="k">客户区</span><span class="v" id="size">—</span></div>
        <div class="row"><span class="k">采集帧率</span><span class="v" id="cfps">—</span></div>
        <div class="row"><span class="k">推送帧率</span><span class="v" id="sfps">—</span></div>
        <div class="row"><span class="k">帧延迟</span><span class="v" id="age">—</span></div>
        <div class="row"><span class="k">视频延迟</span><span class="v" id="vlat">—</span></div>
        <div class="row"><span class="k">检测耗时</span><span class="v" id="dms">—</span></div>
        <div class="row"><span class="k">检出目标</span><span class="v" id="targets">—</span></div>
        <div class="row"><span class="k">瞬现过滤</span><span class="v" id="pending">—</span></div>
        <div class="row"><span class="k">类别</span><span class="v small" id="classes">—</span></div>
        <div class="row"><span class="k">锁定目标</span><span class="v small" id="lock">—</span></div>
        <div class="row"><span class="k">推理模式</span><span class="v small" id="mode">—</span></div>
      </div>
      <div class="actions">
        <button id="toggle">暂停</button>
        <button id="detect">识别: 关</button>
        <button id="modeBtn">模式: 速度</button>
        <button id="focusBtn" title="把游戏窗口抬到最前并给焦点（截图前必做）">前置游戏</button>
        <button id="calBtn" title="依次框出 HP / MP / EXP 条的位置（沿条拖一下就行，会自动补齐整条槽）">标定条</button>
        <button id="autoBtn" title="在画面底部自动找三条血/蓝/经验条；自动模式下换客户端、换分辨率会自己重新定位，一般不用点">自动定位</button>
        <button id="ovBtn" title="在画面上画出三条的框：白框=参与判定的 ROI，洋红框=整条槽（百分比的分母），黄竖线=填充终点">标定框: 关</button>
        <button id="qBtn" title="外网看画面用的码率档位。网慢就选流畅；只有走穿透/逐帧时才有意义，本地直连不受影响">画质: 标准</button>
        <button id="snap">存快照</button>
      </div>
      <div class="filterrow">
        <input id="filter" placeholder="只识别某类，如 Stump（留空 = 全部）" spellcheck="false" />
      </div>
    </div>
  </div>

  <p class="note">双击选区进入编辑（拖动移动 · 拉角缩放 · 右上角 ✕ 删除）· 右键画面可添加排除区 · 改动即时保存到 webui/masks.json · 三条状态条默认自动定位（换客户端/换分辨率会自己重定位）；自动定位失效时才用「标定条」按 HP → MP → EXP 顺序沿条拖一个框（只框彩色部分也行，会自动补齐整条槽），手框过的坐标不再被自动覆盖</p>
</div>

<div class="ctx" id="ctxMenu"></div>

<div class="cbox" id="confirmBox">
  <div class="cbox-card">
    <div class="cbox-t">删除这个排除区域？</div>
    <div class="cbox-d" id="cDesc"></div>
    <div class="cbox-btns">
      <button id="cCancel">取消</button>
      <button id="cOk" class="danger">删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const view = $("view");
  let paused = false;
  let overlayOn = false;          // 是否在画面上画出三条状态条的定位框
  /* 内网穿透（tunnelmole/ngrok/cloudflared…）会把 MJPEG 长连接憋住，而且很多免费隧道
     只有一条到本机的连接：一旦开 /stream 就会把整条隧道堵死。所以——非本机访问时
     一开始就用逐帧轮询，连试都不试。本地直连照旧走流，最省 CPU。 */
  const LOCAL_HOSTS = ["localhost", "127.0.0.1", "::1", "[::1]", ""];
  // 调试用：本机打开 ?video=1 也能走 H.264 通道，不用非得先挂隧道
  const FORCE_REMOTE = new URLSearchParams(location.search).has("video");
  let remoteMode = FORCE_REMOTE || !LOCAL_HOSTS.includes(location.hostname);

  function streamURL() {
    if (paused) return "";
    return "/stream?t=" + Date.now() + (overlayOn ? "&bars=1" : "");
  }

  function snapURL(big) {
    const q = ["t=" + Date.now(), "fresh=0"];
    if (overlayOn) q.push("bars=1");
    if (!big) { q.push("w=1000", "q=68"); }   // 远程模式：压小压瘦，省流量
    return "/api/snapshot?" + q.join("&");
  }

  let pollOn = false, pollNext = null, lastFrameAt = 0, streamStartAt = 0;

  /* 逐帧模式必须"一张拿完再要下一张"：穿透链路上单张要几百毫秒到几秒，
     用 setInterval 定时换 src 会在上一张还没下载完时打断它，永远显示不出画面。 */
  function startPoll() {
    pollOn = true;
    if (!paused) view.src = snapURL(false);
  }

  function stopPoll() {
    pollOn = false;
    clearTimeout(pollNext);
    pollNext = null;
  }

  function scheduleNextPoll() {
    if (!remoteMode || videoMode || !pollOn || paused) return;
    clearTimeout(pollNext);
    pollNext = setTimeout(() => {
      if (remoteMode && pollOn && !paused && !videoMode) view.src = snapURL(false);
    }, 220);
  }

  /* ========== H.264 实时视频（MSE）==========
     外网不再一帧一张 JPEG：服务端 ffmpeg 把画面编成 H.264（只传变化的部分），
     每 0.5 秒切一个 fMP4 分片；这里用"短请求"逐片取、喂给 MediaSource 解码播放。
     带宽约 1.5~2.5 Mbps（逐帧 JPEG 是它的 5~10 倍），延迟约 1 秒。
     为什么不用长连接直播：免费内网穿透会把 chunked 长连接攒一大坨再发，
     延迟能到十几秒甚至把整条隧道堵死；短请求没有这个问题。 */
  const videoEl = $("video");
  const VIDEO_MIME = 'video/mp4; codecs="avc1.42E028"';
  /* 外网带宽是硬瓶颈：实测常见家用上行 + 免费隧道只有 1 Mbps 上下，
     所以默认 900k / 1000px / 15fps，画面在 MapleStory 这种平涂画面上够看。 */
  const QUALITY = {
    low:  { w: 800,  fps: 12, kb: 450,  label: "流畅" },
    mid:  { w: 1000, fps: 15, kb: 900,  label: "标准" },
    high: { w: 1200, fps: 20, kb: 1600, label: "高清" },
  };
  const QKEYS = ["low", "mid", "high"];
  let quality = localStorage.getItem("msfarm.quality") || "mid";
  if (!QUALITY[quality]) quality = "mid";
  function qualitySpec() { return QUALITY[quality]; }
  let videoMode = false, videoKill = 0, videoUrl = null, videoFails = 0, videoFrags = 0;
  let videoPath = "";             // live=单连接直播 / seg=分片轮询（隧道缓冲时用）
  let videoStalls = 0;            // 播放等待次数：网跟不上就自动降一档画质

  function videoOK() {
    return !!(window.MediaSource && MediaSource.isTypeSupported(VIDEO_MIME) && window.fetch);
  }

  function videoQuery() {
    const spec = qualitySpec();
    const q = ["w=" + spec.w, "fps=" + spec.fps, "kb=" + spec.kb];
    if (overlayOn) q.push("bars=1");
    return "?" + q.join("&");
  }

  function videoBadge() {
    return overlayOn ? "H.264 · 含定位框" : "H.264 实时";
  }

  function stopVideo() {
    videoKill++;
    videoMode = false;
    tile.classList.remove("video");
    try { videoEl.pause(); } catch (e) { /* 忽略 */ }
    videoEl.removeAttribute("src");
    try { videoEl.load(); } catch (e) { /* 忽略 */ }
    if (videoUrl) { URL.revokeObjectURL(videoUrl); videoUrl = null; }
    $("vlat").textContent = "—";
    $("vlat").className = "v";
  }

  function videoSleep(ms) { return new Promise((ok) => setTimeout(ok, ms)); }

  /* 把任意长度的字节流切回一个个完整盒子：init(ftyp+moov) 和分片(moof+mdat)。
     隧道回来的 chunk 边界是随机的，直接 appendBuffer 有概率被判成非法段，
     所以先在本地拼完整再喂给 MSE。 */
  function makeSplitter(onUnit) {
    let rest = new Uint8Array(0);
    let initParts = [], cur = null;
    const u32 = (b, o) => ((b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3]) >>> 0;
    const tag = (b, o) => String.fromCharCode(b[o], b[o + 1], b[o + 2], b[o + 3]);
    const join = (parts) => {
      let n = 0;
      parts.forEach((p) => { n += p.length; });
      const out = new Uint8Array(n);
      let off = 0;
      parts.forEach((p) => { out.set(p, off); off += p.length; });
      return out;
    };
    return function push(chunk) {
      const b = new Uint8Array(rest.length + chunk.length);
      b.set(rest, 0); b.set(chunk, rest.length);
      let off = 0;
      while (off + 8 <= b.length) {
        let size = u32(b, off);
        const typ = tag(b, off + 4);
        let hdr = 8;
        if (size === 1) {
          if (off + 16 > b.length) break;
          size = u32(b, off + 8) * 4294967296 + u32(b, off + 12);
          hdr = 16;
        }
        if (size < hdr || off + size > b.length) break;    // 还没收全
        const box = b.subarray(off, off + size);
        off += size;
        if (typ === "moof") {
          cur = [box];
        } else if (typ === "mdat") {
          if (cur) { cur.push(box); onUnit(join(cur)); cur = null; }
        } else if (!cur) {
          initParts.push(box);
          if (typ === "moov") onUnit(join(initParts));
        }
      }
      rest = b.subarray(off);
    };
  }

  async function openMSE() {
    const ms = new MediaSource();
    if (videoUrl) URL.revokeObjectURL(videoUrl);
    videoUrl = URL.createObjectURL(ms);
    videoEl.src = videoUrl;
    await new Promise((ok, fail) => {
      const t = setTimeout(() => fail(new Error("MediaSource 打不开")), 6000);
      ms.addEventListener("sourceopen", () => { clearTimeout(t); ok(); }, { once: true });
    });
    return { ms, sb: ms.addSourceBuffer(VIDEO_MIME) };
  }

  function makeFeeder(sb) {
    const waitEnd = () => new Promise((ok) => {
      const done = () => { sb.removeEventListener("updateend", done); ok(); };
      sb.addEventListener("updateend", done);
    });
    // 追直播点：落后超过 1.2 秒就跳回最新处，别越播越落后
    const syncLive = () => {
      const b = videoEl.buffered;
      if (!b.length) return;
      const end = b.end(b.length - 1);
      if (videoEl.paused) videoEl.play().catch(() => {});
      if (videoEl.currentTime < end - 1.2 || videoEl.currentTime > end) {
        videoEl.currentTime = Math.max(0, end - 0.12);
      }
    };
    const feed = async (buf) => {
      if (!buf || !buf.length) return;
      try {
        if (sb.updating) await waitEnd();
        sb.appendBuffer(buf);
        await waitEnd();
      } catch (e) {
        // 缓冲满了就先砍掉旧的再来一次
        const b = sb.buffered;
        if (b.length) {
          try { sb.remove(b.start(0), b.end(b.length - 1)); await waitEnd(); sb.appendBuffer(buf); await waitEnd(); }
          catch (e2) { return; }
        } else { return; }
      }
      const b = sb.buffered;
      if (b.length && b.end(b.length - 1) - b.start(0) > 8) {
        const from = b.start(0), to = b.end(b.length - 1) - 6;
        if (to > from) { try { sb.remove(from, to); await waitEnd(); } catch (e) { /* 忽略 */ } }
      }
      syncLive();
    };
    return feed;
  }

  function markVideoReady() {
    if (videoMode) return;
    videoMode = true;
    tile.classList.add("video");
    $("badge").textContent = videoBadge();
    $("dot").className = "dot on";
    layoutLayer();
  }

  async function startVideo() {
    const kill = ++videoKill;
    const { sb } = await openMSE();
    if (kill !== videoKill) return;
    const feed = makeFeeder(sb);
    let chain = Promise.resolve();
    // 每喂完一段就试着点亮"已出画面"（markVideoReady 是幂等的）
    const enqueue = (buf) => {
      chain = chain.then(() => feed(buf)).then(() => markVideoReady()).catch(() => {});
      return chain;
    };
    const splitter = makeSplitter(enqueue);

    // 卡顿监控：6 秒内出现 3 次以上缓冲等待，说明带宽不够，自动降一档
    const mon = setInterval(() => {
      if (kill !== videoKill) { clearInterval(mon); return; }
      if (videoStalls >= 3 && quality !== "low") {
        quality = quality === "high" ? "mid" : "low";
        localStorage.setItem("msfarm.quality", quality);
        renderQualityBtn();
        toast("网速跟不上，已自动切到「" + qualitySpec().label + "」");
        videoStalls = 0;
        applyTransport();
      } else {
        videoStalls = 0;
      }
    }, 6000);

    // ① 先试长连接直播（最省事、延迟最低）
    let got = false;
    const ctrl = new AbortController();
    const timer = setTimeout(() => { if (!got) ctrl.abort(); }, 6000);
    try {
      const res = await fetch("/video/live" + videoQuery(), { cache: "no-store", signal: ctrl.signal });
      if (res.ok && res.body) {
        const reader = res.body.getReader();
        while (kill === videoKill && !paused) {
          const { value, done } = await reader.read();
          if (done || !value) break;
          if (!got) { got = true; clearTimeout(timer); videoPath = "live"; }
          splitter(value);
        }
      }
    } catch (e) {
      // 被 abort / 隧道把长连接憋住了
    } finally {
      clearTimeout(timer);
    }
    if (kill !== videoKill || paused) return;
    await chain;
    if (got) { markVideoReady(); return; }

    // ② 长连接不给数据（tunnelmole 这类会整段缓冲）→ 改用短请求逐片取
    videoPath = "seg";
    const init = await fetch("/video/init" + videoQuery(), { cache: "no-store" });
    if (!init.ok) throw new Error("init HTTP " + init.status);
    let seq = parseInt(init.headers.get("X-Seq") || "0", 10) || 0;
    await feed(new Uint8Array(await init.arrayBuffer()));
    if (kill !== videoKill) return;
    markVideoReady();
    while (kill === videoKill && !paused) {
      let r;
      try {
        r = await fetch("/video/seg?i=" + seq + videoQuery(), { cache: "no-store" });
      } catch (e) {
        await videoSleep(500);
        continue;
      }
      if (kill !== videoKill) return;
      const next = parseInt(r.headers.get("X-Next") || seq, 10);
      if (r.status === 409) throw new Error("分片已过期");
      if (r.status === 204) { seq = next; continue; }
      if (!r.ok) { await videoSleep(400); continue; }
      seq = next;
      const age = parseInt(r.headers.get("X-Age") || "-1", 10);
      await feed(new Uint8Array(await r.arrayBuffer()));
      videoFrags++;
      if (age >= 0) {
        const b = videoEl.buffered;
        const ahead = b.length ? Math.max(0, b.end(b.length - 1) - videoEl.currentTime) : 0;
        const ms = age + ahead * 1000;
        $("vlat").textContent = Math.round(ms) + " ms";
        $("vlat").className = "v" + (ms > 2500 ? " warn" : "");
      }
    }
  }

  async function startRemote() {
    if (videoOK() && videoFails < 3) {
      try {
        await startVideo();
        return;
      } catch (e) {
        videoFails++;
        stopVideo();
        console.warn("H.264 起不来", e);
        if (videoFails >= 3) toast("视频流起不来，已回退到逐帧刷新", true);
      }
    }
    // 回退：一帧一张 JPEG（浏览器不支持 MSE 时）
    startPoll();
    view.src = snapURL(false);
    $("badge").textContent = "远程 · 逐帧";
    $("dot").className = "dot on";
  }

  function applyTransport() {
    stopPoll();
    stopVideo();
    if (paused) { view.src = ""; return; }
    if (remoteMode) { startRemote(); }
    else { streamStartAt = Date.now(); view.src = streamURL(); }
  }

  /* 看门狗：本地直连时 <img> 会不断触发 load（每帧一次）；走穿透时中间层把
     多部分流憋住，一个字节都不给 -> 5 秒内没帧就自动切逐帧模式。 */
  setInterval(() => {
    if (paused || remoteMode || videoMode) return;
    const since = lastFrameAt || streamStartAt;
    if (since && Date.now() - since > 5000) useRemoteMode();
  }, 2000);

  /* 预览尺寸不用手动调：宽度完全跟着页面走（上限 1366，见 CSS --page-max），
     高度由画面真实比例算出来，窗口一变就自动等比缩放。 */

  /* ========== 排除区域：半透明遮罩 · 双击编辑 · 右键菜单 · 角上删除 ========== */
  const tile = $("tile");
  const tileWrap = $("tileWrap");
  const maskLayer = $("maskLayer");
  const mctx = maskLayer.getContext("2d");
  const ctxMenu = $("ctxMenu");

  const RED_FILL = "rgba(239,68,68,.20)", RED_LINE = "rgba(239,68,68,.95)";
  const BLUE_FILL = "rgba(37,99,235,.20)", BLUE_LINE = "#2563eb";
  const MIN_N = 0.012;            // 新框最小边长（归一化），小于此值视为误点
  const DEL_SIZE = 20;            // 选区右上角删除按钮边长（px）

  let masks = [];                 // [{id,x1,y1,x2,y2}] 归一化
  let maskOn = true;              // 与后端 det_state["mask"] 同步
  let editMode = false;           // 编辑模式：可拖动 / 缩放 / 删除选区
  let selId = null;               // 当前选中的区域
  let drag = null;                // {mode:"new"|"move"|"resize", ...}
  let addArmed = false;           // 右键"添加"后置位：下一次拖拽强制画新框
  let ctxHitId = null;            // 右键菜单针对的区域
  let confirmId = null;           // 等待确认删除的区域
  let lastNW = 0, lastNH = 0;     // 缓存画面原始尺寸（暂停时 naturalWidth 会变 0）

  /* ========== 状态条（HP / MP / EXP）==========
     三条是固定 UI，后端按色相逐列扫描算百分比；前端只负责显示 + 标定。
     标定 = 在画面上沿条拖一个框（只框彩色部分也行，后端会自动补齐整条槽），一次就够
     bars.json，换分辨率再标一次。 */
  const BAR_ORDER = ["hp", "mp", "exp"];
  const BAR_NAME = { hp: "HP", mp: "MP", exp: "EXP" };
  const BAR_COLORS = { hp: "#dc2626", mp: "#2563eb", exp: "#65a30d" };
  let barsCfg = {};               // kind -> {x1,y1,x2,y2,hue}
  let barCal = null;              // 正在标定的条 kind，null 表示不在标定
  let barQueue = [];              // 待标定的剩余条（按 hp -> mp -> exp 顺序）
  let grabberReady = false;       // 抓到画面后才知道画面比例，标定前先确认
  const L = { w: 0, h: 0, ox: 0, oy: 0 }; // 内容区尺寸 + 内容区在 canvas 内的偏移
  // 遮罩 canvas 盖住 tile 并四周外扩 PAD(px)：贴边选区(x2=1.0 等)的把手
  // 在画面边界上，不外扩的话边界像素的事件落不到 canvas，导致边缘把手抓不到、拖了也不保存。
  // canvas 放在 tileWrap 里（tile 有 overflow:hidden 会裁掉外扩部分）
  const PAD = 10;
  const X = (n) => L.ox + n * L.w;   // 归一化 x -> canvas 像素
  const Y = (n) => L.oy + n * L.h;   // 归一化 y -> canvas 像素

  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
  const pct = (v) => Math.round(v * 100) + "%";

  function normRect(x1, y1, x2, y2) {
    return { x1: clamp01(Math.min(x1, x2)), y1: clamp01(Math.min(y1, y2)),
             x2: clamp01(Math.max(x1, x2)), y2: clamp01(Math.max(y1, y2)) };
  }

  // 把遮罩层对齐到 object-fit:contain 之后的真实画面区域（去掉黑边）
  // 画面真实尺寸：视频模式看 <video>，图片模式看 <img>
  function frameSize() {
    if (videoMode && videoEl.videoWidth) return [videoEl.videoWidth, videoEl.videoHeight];
    return [view.naturalWidth || 0, view.naturalHeight || 0];
  }

  function layoutLayer() {
    const [fw, fh] = frameSize();
    if (fw && fh) {
      lastNW = fw; lastNH = fh;
      // 画面比例变了（游戏改分辨率 / 窗口被拉伸）→ 容器比例跟着换，不留黑边
      const ar = lastNW + " / " + lastNH;
      if (tile.style.aspectRatio !== ar) tile.style.aspectRatio = ar;
    }
    const nw = lastNW || 16, nh = lastNH || 9;
    const bw = tile.clientWidth, bh = tile.clientHeight;
    if (!bw || !bh) return;
    const scale = Math.min(bw / nw, bh / nh);
    const w = Math.max(1, Math.round(nw * scale));
    const h = Math.max(1, Math.round(nh * scale));
    L.w = w; L.h = h;
    L.ox = PAD + Math.round((bw - w) / 2);
    L.oy = PAD + Math.round((bh - h) / 2);
    // canvas 比 tile 四周各大一圈 PAD，tileWrap 有空余不裁剪，贴边把手也能收到事件
    const cw = bw + 2 * PAD, ch = bh + 2 * PAD;
    maskLayer.style.width = cw + "px";
    maskLayer.style.height = ch + "px";
    // 用实测矩形定位（tileWrap 有 padding + 负 margin，offsetLeft 不再可靠）
    const tr = tile.getBoundingClientRect(), wr = tileWrap.getBoundingClientRect();
    maskLayer.style.left = (tr.left - wr.left - PAD) + "px";
    maskLayer.style.top = (tr.top - wr.top - PAD) + "px";
    const dpr = window.devicePixelRatio || 1;
    const pxw = Math.round(cw * dpr), pxh = Math.round(ch * dpr);
    if (maskLayer.width !== pxw || maskLayer.height !== pxh) {
      maskLayer.width = pxw; maskLayer.height = pxh;
    }
    mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawMasks();
  }

  function drawBarRects() {
    if (!barCal || !L.w || !L.h) return;     // 只在标定时显示框，平时看下面的读数即可
    BAR_ORDER.forEach((k) => {
      const b = barsCfg[k];
      if (!b) return;
      const x = X(b.x1), y = Y(b.y1);
      const w = (b.x2 - b.x1) * L.w, h = (b.y2 - b.y1) * L.h;
      mctx.setLineDash([]);
      // 先白后彩：血条本身就是红的，纯红框压在红条上根本看不出来
      mctx.strokeStyle = "rgba(255,255,255,.92)";
      mctx.lineWidth = 3;
      mctx.strokeRect(x + 0.5, y + 0.5, Math.max(0, w - 1), Math.max(0, h - 1));
      mctx.strokeStyle = BAR_COLORS[k];
      mctx.lineWidth = 1.4;
      mctx.strokeRect(x + 0.5, y + 0.5, Math.max(0, w - 1), Math.max(0, h - 1));
    });
  }

  function drawMasks() {
    if (!L.w || !L.h) return;
    mctx.clearRect(0, 0, maskLayer.clientWidth, maskLayer.clientHeight);
    drawBarRects();
    if (!maskOn) return;

    masks.forEach((m, i) => {
      const x = X(m.x1), y = Y(m.y1);
      const w = (m.x2 - m.x1) * L.w, h = (m.y2 - m.y1) * L.h;
      const sel = m.id === selId;
      mctx.fillStyle = sel ? BLUE_FILL : RED_FILL;
      mctx.fillRect(x, y, w, h);
      mctx.lineWidth = sel ? 2 : 1.25;
      mctx.setLineDash(sel ? [] : [6, 4]);
      mctx.strokeStyle = sel ? BLUE_LINE : RED_LINE;
      mctx.strokeRect(x + 0.5, y + 0.5, Math.max(0, w - 1), Math.max(0, h - 1));
      mctx.setLineDash([]);
      // 编号标识
      if (w > 18 && h > 16) {
        mctx.font = "600 11px ui-monospace, Menlo, Consolas, monospace";
        mctx.fillStyle = sel ? "#1d4ed8" : "#991b1b";
        mctx.fillText(String(i + 1), x + 5, y + 14);
      }
      if (sel && editMode) {
        // 3x3 九点控制柄：够大时画全部，太挤就只画四角
        const pts = handlePts(m).map(([hx, hy]) => [X(hx), Y(hy)]);
        const showAll = w >= 30 && h >= 30;
        pts.forEach(([hx, hy], i) => {
          if (!showAll && i !== 0 && i !== 2 && i !== 6 && i !== 8) return;
          mctx.beginPath();
          if (i === 4) mctx.arc(hx, hy, 3.5, 0, Math.PI * 2);   // 中心点用圆点
          else mctx.rect(hx - 3.5, hy - 3.5, 7, 7);
          mctx.fillStyle = i === 4 ? BLUE_LINE : "#fff";
          mctx.fill();
          mctx.strokeStyle = BLUE_LINE;
          mctx.lineWidth = 1.25;
          mctx.stroke();
        });
        // 右上角删除按钮
        const b = delBtnRect(m);
        mctx.fillStyle = "rgba(220,38,38,.95)";
        mctx.beginPath();
        if (mctx.roundRect) mctx.roundRect(b.x, b.y, b.w, b.h, 5);
        else mctx.rect(b.x, b.y, b.w, b.h);
        mctx.fill();
        mctx.strokeStyle = "#fff";
        mctx.lineWidth = 1.6;
        mctx.beginPath();
        mctx.moveTo(b.x + 6.5, b.y + 6.5);
        mctx.lineTo(b.x + b.w - 6.5, b.y + b.h - 6.5);
        mctx.moveTo(b.x + b.w - 6.5, b.y + 6.5);
        mctx.lineTo(b.x + 6.5, b.y + b.h - 6.5);
        mctx.stroke();
      }
    });

    if (drag && (drag.mode === "new" || drag.mode === "bar")) {
      const r = normRect(drag.start.x, drag.start.y, drag.cur.x, drag.cur.y);
      mctx.fillStyle = "rgba(37,99,235,.16)";
      mctx.fillRect(X(r.x1), Y(r.y1), (r.x2 - r.x1) * L.w, (r.y2 - r.y1) * L.h);
      mctx.setLineDash([5, 4]);
      mctx.strokeStyle = BLUE_LINE;
      mctx.lineWidth = 1.5;
      mctx.strokeRect(X(r.x1), Y(r.y1), (r.x2 - r.x1) * L.w, (r.y2 - r.y1) * L.h);
      mctx.setLineDash([]);
    }
  }

  function toNorm(e) {
    const r = maskLayer.getBoundingClientRect();
    if (!L.w || !L.h) return { x: 0, y: 0 };
    // canvas 四周多出 PAD（外加 tile 内可能的黑边），坐标换算要扣掉
    return { x: clamp01((e.clientX - r.left - L.ox) / L.w),
             y: clamp01((e.clientY - r.top - L.oy) / L.h) };
  }

  const inside = (m, p) => p.x >= m.x1 && p.x <= m.x2 && p.y >= m.y1 && p.y <= m.y2;

  // 九点控制柄：0左上 1上中 2右上 3左中 4中心 5右中 6左下 7下中 8右下
  const HANDLE_CURSORS = ["nwse-resize", "ns-resize", "nesw-resize",
                          "ew-resize", "move", "ew-resize",
                          "nesw-resize", "ns-resize", "nwse-resize"];

  function handlePts(m) {
    const xm = (m.x1 + m.x2) / 2, ym = (m.y1 + m.y2) / 2;
    return [[m.x1, m.y1], [xm, m.y1], [m.x2, m.y1],
            [m.x1, ym], [xm, ym], [m.x2, ym],
            [m.x1, m.y2], [xm, m.y2], [m.x2, m.y2]];
  }

  function hitHandle(m, p) {
    // 角/边容差 9px；中心点小一些(6px)，避免和"拖动整框"打架
    const txA = Math.max(0.008, 9 / (L.w || 1));
    const tyA = Math.max(0.008, 9 / (L.h || 1));
    const txC = Math.max(0.008, 6 / (L.w || 1));
    const tyC = Math.max(0.008, 6 / (L.h || 1));
    const pts = handlePts(m);
    for (let i = 0; i < 9; i++) {
      if (i === 4) continue;                        // 中心点最后判
      if (Math.abs(p.x - pts[i][0]) <= txA && Math.abs(p.y - pts[i][1]) <= tyA) return i;
    }
    if (Math.abs(p.x - pts[4][0]) <= txC && Math.abs(p.y - pts[4][1]) <= tyC) return 4;
    return -1;
  }

  function resizeRect(o, handle, p) {
    let { x1, y1, x2, y2 } = o;
    if (handle === 0) { x1 = p.x; y1 = p.y; }
    else if (handle === 1) { y1 = p.y; }
    else if (handle === 2) { x2 = p.x; y1 = p.y; }
    else if (handle === 3) { x1 = p.x; }
    else if (handle === 5) { x2 = p.x; }
    else if (handle === 6) { x1 = p.x; y2 = p.y; }
    else if (handle === 7) { y2 = p.y; }
    else if (handle === 8) { x2 = p.x; y2 = p.y; }
    return normRect(x1, y1, x2, y2);
  }

  function delBtnRect(m) {
    return { x: X(m.x2) - DEL_SIZE - 4, y: Y(m.y1) + 4, w: DEL_SIZE, h: DEL_SIZE };
  }

  function hitDelBtn(m, p) {
    if (!editMode) return false;
    const px = X(p.x), py = Y(p.y), b = delBtnRect(m);
    return px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
  }

  /* ---------- 与后端交互 ---------- */
  async function postJSON(url, body) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
      cache: "no-store"
    });
    const data = await res.json().catch(() => ({}));
    if (Array.isArray(data.masks)) masks = data.masks;
    if (!res.ok || data.error) throw new Error(data.error || ("HTTP " + res.status));
    return data;
  }

  let toastTimer = null;
  function toast(txt, bad) {
    const el = $("toast");
    el.textContent = txt;
    el.style.background = bad ? "rgba(185,28,28,.92)" : "rgba(28,25,23,.9)";
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
  }

  function updateMaskUI() {
    tileWrap.classList.toggle("editing", maskOn && editMode);
    drawMasks();
  }

  async function setMaskOn(on) {
    try {
      const r = await (await fetch("/api/detect/mask?on=" + (on ? 1 : 0),
                                   { cache: "no-store" })).json();
      maskOn = !!r.mask;
    } catch (e) { /* 网络异常就保持原状 */ }
    updateMaskUI();
  }

  function enterEdit(id) {
    addArmed = false;
    editMode = true;
    selId = id;
    updateMaskUI();
  }

  function exitEdit() {
    editMode = false;
    selId = null;
    drag = null;
    addArmed = false;
    updateMaskUI();
  }

  async function deleteMask(id) {
    try {
      await postJSON("/api/masks/delete", { id });
      if (selId === id) selId = null;
      toast("已删除并保存");
    } catch (err) {
      toast(err.message || "删除失败", true);
    }
    drawMasks();
  }

  async function commitAdd(r) {
    try {
      const data = await postJSON("/api/masks/add", r);
      selId = data.id || null;
      editMode = true;                    // 画完直接进入编辑态，方便微调
      toast("已添加并保存");
    } catch (err) {
      toast(err.message || "保存失败", true);
    }
    updateMaskUI();
  }

  async function commitUpdate(m) {
    try {
      await postJSON("/api/masks/update",
                     { id: m.id, x1: m.x1, y1: m.y1, x2: m.x2, y2: m.y2 });
      toast("已保存");
    } catch (err) {
      toast(err.message || "保存失败", true);
    }
    drawMasks();
  }

  /* ---------- 状态条：标定 / 读数 ---------- */
  function startBarCal() {
    if (!grabberReady) { toast("还没抓到画面，先让游戏窗口在前台", true); return; }
    barQueue = BAR_ORDER.slice();
    nextBarCal();
  }

  function nextBarCal() {
    if (!barQueue.length) {
      barCal = null;
      $("calBtn").className = "";
      $("calBtn").textContent = "标定条";
      toast("三条都标定好了");
      drawMasks();
      return;
    }
    barCal = barQueue.shift();
    $("calBtn").className = "on";
    $("calBtn").textContent = "标定: " + BAR_NAME[barCal];
    toast(`沿 ${BAR_NAME[barCal]} 条从左到右拖一个框：高度贴着条，右侧空槽会自动补齐`);
    drawMasks();
  }

  function cancelBarCal(quiet) {
    barCal = null;
    barQueue = [];
    $("calBtn").className = "";
    $("calBtn").textContent = "标定条";
    if (!quiet) toast("已取消标定");
    drawMasks();
  }

  async function commitBar(d) {
    const kind = d.kind;
    const r = normRect(d.start.x, d.start.y, d.cur.x, d.cur.y);
    if (r.x2 - r.x1 < 0.008 || r.y2 - r.y1 < 0.003) {
      toast("框太小了，重画一次", true);
      drawMasks();
      return;
    }
    try {
      const res = await postJSON("/api/bars/set", { kind, ...r });
      if (!res.ok) throw new Error(res.msg || "保存失败");
      // 后端会把框自动补齐成整条槽，用返回的矩形重画，让用户看到实际生效的范围
      const saved = res.rect || r;
      barsCfg[kind] = { ...saved, hue: res.hue };
      const fixed = Math.abs((saved.x2 - saved.x1) - (r.x2 - r.x1)) > 0.002;
      toast(`${BAR_NAME[kind]} 标定完成${fixed ? "（已自动补齐整条槽）" : ""}`);
      nextBarCal();
    } catch (err) {
      toast(err.message || "保存失败", true);
      drawMasks();
    }
  }

  function renderBars(vals) {
    document.querySelectorAll(".bar").forEach((el) => {
      const k = el.dataset.k;
      const v = vals ? vals[k] : null;
      const fillEl = el.querySelector(".btrack i");
      const txt = el.querySelector(".bv");
      if (v === null || v === undefined) {
        fillEl.style.width = "0%";
        txt.textContent = "—";
        el.classList.add("off");
        el.classList.remove("low");
        return;
      }
      el.classList.remove("off");
      const p = Math.min(100, Math.max(0, v));
      fillEl.style.width = p.toFixed(1) + "%";
      txt.textContent = p.toFixed(1) + "%";
      el.classList.toggle("low", (k === "hp" || k === "mp") && p < 30);
    });
  }

  async function pollBars() {
    try {
      const r = await (await fetch("/api/bars", { cache: "no-store" })).json();
      barsCfg = r.bars || {};
      renderBars(r.values);
      const el = $("barsrc");
      if (el) {
        const src = r.source === "manual" ? "手动" : "自动";
        el.textContent = r.note ? `${src} · ${r.note}` : src;
        el.title = r.note || "";
      }
    } catch (e) { /* 服务未就绪：保持上次读数 */ }
  }

  $("ovBtn").addEventListener("click", (e) => {
    overlayOn = !overlayOn;
    const btn = e.currentTarget;
    btn.textContent = "标定框: " + (overlayOn ? "开" : "关");
    btn.classList.toggle("on", overlayOn);
    applyTransport();
    if (!paused && !videoMode) $("badge").textContent = overlayOn ? "实时 · 含定位框" : "实时";
  });

  $("calBtn").addEventListener("click", () => {
    if (barCal) cancelBarCal();
    else startBarCal();
  });

  $("autoBtn").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    if (!grabberReady) { toast("还没抓到画面，先让游戏窗口在前台", true); return; }
    if (barCal) cancelBarCal();
    btn.disabled = true;
    btn.textContent = "定位中…";
    try {
      const res = await postJSON("/api/bars/autolocate", {});
      if (!res.ok) throw new Error(res.msg || "没找到");
      barsCfg = res.bars || {};
      toast("已自动定位三条槽");
      await pollBars();
    } catch (err) {
      toast(err.message || "自动定位失败", true);
    } finally {
      btn.disabled = false;
      btn.textContent = "自动定位";
    }
  });

  /* ---------- 删除二次确认弹窗 ---------- */
  function askDelete(id) {
    const m = masks.find((x) => x.id === id);
    if (!m) return;
    $("cDesc").textContent =
      `区域 ${pct(m.x1)}, ${pct(m.y1)} → ${pct(m.x2)}, ${pct(m.y2)}，删除后立即生效并写入 masks.json。`;
    confirmId = id;
    $("confirmBox").classList.add("open");
  }

  function closeConfirm() {
    confirmId = null;
    $("confirmBox").classList.remove("open");
  }

  $("cCancel").addEventListener("click", closeConfirm);
  $("confirmBox").addEventListener("click", (e) => {
    if (e.target === $("confirmBox")) closeConfirm();
  });
  $("cOk").addEventListener("click", async () => {
    const id = confirmId;
    closeConfirm();
    if (id) await deleteMask(id);
  });

  /* ---------- 右键菜单 ---------- */
  function closeCtx() {
    ctxMenu.classList.remove("open");
    ctxHitId = null;
  }

  function openCtx(x, y, hitId) {
    ctxHitId = hitId;
    const items = [
      { act: "add", label: "添加排除区域" },
      ...(hitId ? [
        { act: "edit", label: "编辑此选区" },
        { act: "del", label: "删除此选区", danger: true },
      ] : []),
      { sep: true },
      { act: "toggle", label: `排除检测：${maskOn ? "开" : "关"}` },
      { act: "reset", label: "恢复默认区域" },
    ];
    ctxMenu.innerHTML = items.map((it) => it.sep ? "<hr/>"
      : `<button data-act="${it.act}"${it.danger ? ' class="danger"' : ""}>${it.label}</button>`).join("");
    ctxMenu.classList.add("open");
    const r = ctxMenu.getBoundingClientRect();
    ctxMenu.style.left = Math.max(6, Math.min(x, innerWidth - r.width - 8)) + "px";
    ctxMenu.style.top = Math.max(6, Math.min(y, innerHeight - r.height - 8)) + "px";
  }

  ctxMenu.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.dataset.act, hitId = ctxHitId;
    closeCtx();
    if (act === "add") {
      addArmed = true;
      if (!maskOn) await setMaskOn(true);
      if (!editMode) { editMode = true; updateMaskUI(); }
      toast("在画面上按住拖拽，画出一块新区域");
    } else if (act === "edit" && hitId) {
      enterEdit(hitId);
    } else if (act === "del" && hitId) {
      askDelete(hitId);
    } else if (act === "toggle") {
      await setMaskOn(!maskOn);
      toast(maskOn ? "排除检测已开启" : "排除检测已关闭（全画面识别）");
    } else if (act === "reset") {
      try {
        await postJSON("/api/masks/reset");
        selId = null;
        editMode = false;
        toast("已恢复默认区域");
      } catch (err) {
        toast(err.message || "恢复失败", true);
      }
      updateMaskUI();
    }
  });

  document.addEventListener("pointerdown", (e) => {
    if (ctxMenu.classList.contains("open") && !ctxMenu.contains(e.target)) closeCtx();
  }, true);
  window.addEventListener("blur", closeCtx);

  /* ---------- 画布交互 ---------- */
  maskLayer.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    if (!maskOn) return;
    const p = toNorm(e);
    const hit = masks.slice().reverse().find((m) => inside(m, p));
    openCtx(e.clientX, e.clientY, hit ? hit.id : null);
  });

  maskLayer.addEventListener("dblclick", (e) => {
    if (!maskOn) return;
    const p = toNorm(e);
    const hit = masks.slice().reverse().find((m) => inside(m, p));
    if (hit) enterEdit(hit.id);          // 双击选区 -> 进入编辑模式
    else if (editMode) exitEdit();       // 双击空白 -> 退出编辑模式
  });

  maskLayer.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    if (!maskOn && !barCal) return;
    e.preventDefault();
    maskLayer.setPointerCapture(e.pointerId);
    const p = toNorm(e);
    if (barCal) {                        // 标定模式：任何拖拽都是在画这一条的框
      drag = { mode: "bar", kind: barCal, start: p, cur: p };
      drawMasks();
      return;
    }
    if (!editMode) return;               // 默认不可编辑：只能双击选区 / 右键菜单进入

    if (addArmed) {                      // 右键"添加"后的一次性画新框
      addArmed = false;
      selId = null;
      drag = { mode: "new", start: p, cur: p };
      drawMasks();
      return;
    }

    const sel = masks.find((m) => m.id === selId);
    if (sel && hitDelBtn(sel, p)) { askDelete(sel.id); return; }
    if (sel) {
      const h = hitHandle(sel, p);
      if (h >= 0 && h !== 4) {
        drag = { mode: "resize", id: sel.id, handle: h, orig: { ...sel }, start: p };
        return;
      }
      if (h === 4 || inside(sel, p)) {   // 中心点 / 框内 = 拖动整框
        drag = { mode: "move", id: sel.id, orig: { ...sel }, start: p };
        drawMasks();
        return;
      }
    }
    // 点到别的选区：切换编辑目标；点空白：什么都不做（不画新框）
    const hit = masks.slice().reverse().find((m) => inside(m, p));
    if (hit) {
      selId = hit.id;
      drag = { mode: "move", id: hit.id, orig: { ...hit }, start: p };
      drawMasks();
    }
  });

  maskLayer.addEventListener("pointermove", (e) => {
    if (!maskOn && !barCal) return;
    const p = toNorm(e);
    if (barCal) {
      maskLayer.style.cursor = "crosshair";
      if (!drag) return;                 // 标定时不参与选区命中判断
    }
    if (!drag) {
      const sel = masks.find((m) => m.id === selId);
      let cur = "crosshair";
      if (editMode && sel && hitDelBtn(sel, p)) cur = "pointer";
      else if (editMode && sel) {
        const h = hitHandle(sel, p);
        cur = h >= 0 ? HANDLE_CURSORS[h]
          : inside(sel, p) ? "move" : "crosshair";
      }
      if (cur === "crosshair" && masks.some((m) => inside(m, p))) {
        cur = editMode ? "move" : "pointer";
      }
      maskLayer.style.cursor = cur;
      return;
    }
    if (drag.mode === "new" || drag.mode === "bar") { drag.cur = p; drawMasks(); return; }
    const m = masks.find((x) => x.id === drag.id);
    if (!m) return;
    if (drag.mode === "move") {
      const dx = Math.min(Math.max(p.x - drag.start.x, -drag.orig.x1), 1 - drag.orig.x2);
      const dy = Math.min(Math.max(p.y - drag.start.y, -drag.orig.y1), 1 - drag.orig.y2);
      m.x1 = drag.orig.x1 + dx; m.x2 = drag.orig.x2 + dx;
      m.y1 = drag.orig.y1 + dy; m.y2 = drag.orig.y2 + dy;
    } else {
      Object.assign(m, resizeRect(drag.orig, drag.handle, p));
    }
    drawMasks();
  });

  maskLayer.addEventListener("pointerup", () => {
    if (!drag) return;
    const d = drag;
    drag = null;
    if (d.mode === "bar") {
      commitBar(d);
      return;
    }
    if (d.mode === "new") {
      const r = normRect(d.start.x, d.start.y, d.cur.x, d.cur.y);
      if (r.x2 - r.x1 < MIN_N || r.y2 - r.y1 < MIN_N) { drawMasks(); return; }  // 误点
      commitAdd(r);
    } else {
      const m = masks.find((x) => x.id === d.id);
      if (!m) { drawMasks(); return; }
      const o = d.orig;
      const same = ["x1", "y1", "x2", "y2"].every((k) => Math.abs(m[k] - o[k]) < 1e-4);
      if (same) { drawMasks(); return; } // 只是点选了一下，没有真的拖动
      commitUpdate(m);
    }
  });
  maskLayer.addEventListener("pointercancel", () => { drag = null; drawMasks(); });

  document.addEventListener("keydown", (e) => {
    if ($("confirmBox").classList.contains("open")) {
      if (e.key === "Escape") closeConfirm();
      return;
    }
    if (e.key === "Escape") {
      if (barCal) { cancelBarCal(); return; }
      if (ctxMenu.classList.contains("open")) { closeCtx(); return; }
      if (editMode) exitEdit();
      return;
    }
    if (!editMode || !selId) return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;
    if (e.key === "Delete" || e.key === "Backspace") {
      e.preventDefault();
      askDelete(selId);                  // 键盘删除同样走二次确认
    }
  });

  async function loadMasks() {
    try {
      const r = await (await fetch("/api/masks", { cache: "no-store" })).json();
      masks = r.masks || [];
      maskOn = r.on !== false;
    } catch (e) { /* 服务未就绪时保持空 */ }
    selId = null;
    editMode = false;
    updateMaskUI(); layoutLayer();
  }

  applyTransport();       // 先定好用流还是逐帧（远端访问直接逐帧）

  if (window.ResizeObserver) new ResizeObserver(layoutLayer).observe(tile);
  window.addEventListener("resize", layoutLayer);
  loadMasks();

  view.addEventListener("load", () => {
    lastFrameAt = Date.now();
    if (!videoMode) {
      $("badge").textContent = remoteMode
        ? "远程 · 逐帧"
        : (overlayOn ? "实时 · 含定位框" : "实时");
    }
    layoutLayer();          // 首帧到达后才知道真实画面比例，重新贴合遮罩层
    scheduleNextPoll();
  });

  videoEl.addEventListener("waiting", () => { videoStalls++; });
  videoEl.addEventListener("loadedmetadata", () => { layoutLayer(); });
  videoEl.addEventListener("resize", () => { layoutLayer(); });

  view.addEventListener("error", () => {
    scheduleNextPoll();     // 远端那张没拿到也要继续排下一张，别卡死
  });

  $("toggle").addEventListener("click", () => {
    paused = !paused;
    $("toggle").textContent = paused ? "继续" : "暂停";
    applyTransport();
    if (paused) { $("badge").textContent = "已暂停"; $("dot").className = "dot"; }
  });

  function renderQualityBtn() {
    $("qBtn").textContent = "画质: " + qualitySpec().label;
    $("qBtn").className = quality === "high" ? "on" : "";
  }

  $("qBtn").addEventListener("click", () => {
    quality = QKEYS[(QKEYS.indexOf(quality) + 1) % QKEYS.length];
    localStorage.setItem("msfarm.quality", quality);
    renderQualityBtn();
    applyTransport();          // 换档要重建编码流，直接从最新画面重新开始
    toast("画质: " + qualitySpec().label + "（约 " + qualitySpec().kb + " kbps）");
  });
  renderQualityBtn();

  $("snap").addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = snapURL(true);
    a.download = "snapshot.jpg";
    a.click();
  });

  $("focusBtn").addEventListener("click", async () => {
    $("focusBtn").disabled = true;
    try {
      const r = await (await fetch("/api/window/focus", { cache: "no-store" })).json();
      toast(r.ok ? "游戏已前置" : (r.msg || "前置失败"), !r.ok);
    } catch (e) {
      toast("前置失败：服务未响应", true);
    } finally {
      $("focusBtn").disabled = false;
    }
  });

  let filterTimer = null;
  $("filter").addEventListener("input", (e) => {
    clearTimeout(filterTimer);
    filterTimer = setTimeout(() => {
      fetch("/api/detect/filter?name=" + encodeURIComponent(e.target.value.trim()),
            { cache: "no-store" });
    }, 250);
  });

  $("detect").addEventListener("click", async () => {
    $("detect").disabled = true;
    try {
      const r = await (await fetch("/api/detect/toggle", { cache: "no-store" })).json();
      $("detect").textContent = r.enabled ? "识别: 开" : "识别: 关";
      $("detect").className = r.enabled ? "on" : "";
    } finally {
      $("detect").disabled = false;
    }
  });

  $("modeBtn").addEventListener("click", async () => {
    $("modeBtn").disabled = true;
    try {
      const cur = $("modeBtn").textContent.includes("速度") ? "accurate" : "fast";
      const r = await (await fetch("/api/detect/mode?m=" + cur, { cache: "no-store" })).json();
      $("modeBtn").textContent = "模式: " + r.label;
      $("modeBtn").className = r.mode === "accurate" ? "on" : "";
    } finally {
      $("modeBtn").disabled = false;
    }
  });

  async function tick() {
    try {
      const s = await (await fetch("/api/stats", { cache: "no-store" })).json();
      const found = s.window_found;
      grabberReady = found;
      $("dot").className = "dot " + (found ? "on" : "off");
      if (!paused) $("badge").textContent = found ? "实时" : "无信号";
      // 窗口标题 / 报错信息改成角标上的悬浮提示，页面上不再占一行文字
      $("badge").title = found
        ? `窗口「${s.window_title}」`
        : (s.error || "未找到游戏窗口");
      $("size").textContent = s.client_size[0] ? `${s.client_size[0]}×${s.client_size[1]}` : "—";
      $("cfps").textContent = found ? s.capture_fps.toFixed(1) : "—";
      $("sfps").textContent = found ? s.stream_fps.toFixed(1) : "—";
      const age = s.frame_age_ms;
      $("age").textContent = age >= 0 ? `${Math.round(age)} ms` : "—";
      $("age").className = "v" + (age > 800 ? " warn" : "");
      $("detect").textContent = s.detect_enabled ? "识别: 开" : "识别: 关";
      $("detect").className = s.detect_enabled ? "on" : "";
      $("dms").textContent = s.detect_ready && s.detect_enabled ? `${s.infer_ms} ms` : "—";
      $("targets").textContent = s.detect_enabled ? s.targets : "—";
      $("pending").textContent = s.detect_enabled
        ? (s.pending ? `${s.pending} 个待确认` : "0")
        : "—";
      $("classes").textContent = s.detect_enabled
        ? (s.detect_loading ? "模型加载中…" : (s.detect_error || s.top_classes.join("　") || "无"))
        : "—";
      const lk = s.lock;
      $("lock").textContent = s.detect_enabled
        ? (s.detect_loading ? "—" : (lk ? `#${lk.tid} ${lk.name} ${lk.conf}` : "无"))
        : "—";
      $("mode").textContent = s.mode === "accurate" ? "精度 544×960" : "速度 384×672";
      $("modeBtn").textContent = "模式: " + s.mode_label;
      $("modeBtn").className = s.mode === "accurate" ? "on" : "";
      if (maskOn !== s.mask) { maskOn = s.mask; updateMaskUI(); }   // 与后端保持一致
      // 游戏窗口改尺寸 / 改分辨率后，画面比例跟着变，遮罩层要重新贴合
      const [fw, fh] = frameSize();
      if (fw && (fw !== lastNW || fh !== lastNH)) layoutLayer();
      if (!paused) {
        $("badge").textContent = videoMode ? videoBadge()
          : (s.detect_loading ? "模型加载中"
            : (s.detect_enabled ? "识别中" : (found ? "实时" : "无信号")));
      }
    } catch (e) {
      $("dot").className = "dot off";
      $("badge").title = "服务已断开";
    }
  }
  tick();
  setInterval(tick, 1000);

  pollBars();                       // 血蓝经验条读数：独立轮询，比统计信息快一档
  setInterval(pollBars, 400);

  /* 页面热更新：index.html 一改（mtime/size 变化）就自动刷新，
     避免对着浏览器的旧缓存误以为改动没生效。 */
  let pageVer = null;
  async function watchVersion() {
    try {
      const r = await (await fetch("/api/ver", { cache: "no-store" })).json();
      if (!r.ver) return;
      if (pageVer === null) pageVer = r.ver;
      else if (r.ver !== pageVer) { location.reload(); return; }
    } catch (e) { /* 服务重启中，忽略 */ }
  }
  watchVersion();
  setInterval(watchVersion, 1500);
</script>
</body>
</html>
